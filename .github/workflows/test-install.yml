# Test that the packed package installs cleanly with NestJS 10, 11 and 12, and
# that a real app boots with the guard on each (TBP-760)
name: Test install

on:
  pull_request:
    branches: [main, v1]
  push:
    branches: [main, v1]

jobs:
  install-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest-version: ['10', '11', '12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and pack package
        run: |
          cd bridge-nestjs
          npm install
          npm run build
          npm pack
          mv nebulr-group-bridge-nestjs-*.tgz ../install-test-pkg.tgz

      - name: Install with NestJS ${{ matrix.nest-version }}
        run: |
          mkdir -p install-test
          cd install-test
          npm init -y
          npm install \
            @nestjs/common@^${{ matrix.nest-version }}.0.0 \
            @nestjs/core@^${{ matrix.nest-version }}.0.0 \
            @nestjs/platform-express@^${{ matrix.nest-version }}.0.0 \
            reflect-metadata@^0.2.0 \
            rxjs@^7.0.0
          npm install ../install-test-pkg.tgz
          echo "Install with NestJS ${{ matrix.nest-version }} succeeded"

      - name: Verify exports
        run: |
          cd install-test
          node -e "
            require('reflect-metadata');
            const pkg = require('@nebulr-group/bridge-nestjs');
            if (!pkg.BridgeModule) throw new Error('BridgeModule not exported');
            if (!pkg.BridgeAuthGuard) throw new Error('BridgeAuthGuard not exported');
            const expected = [
              'BridgeModule', 'BridgeAuthGuard', 'BridgeService', 'BridgeManagementService',
              'BridgeWebhookGuard', 'BridgeMeterInterceptor', 'createBridgeServer', 'BridgeError',
              'isBridgeError', 'FlagSet', 'Public', 'CurrentActor', 'RequireFlag', 'Meter', 'Strict',
            ];
            const missing = expected.filter((name) => pkg[name] === undefined);
            if (missing.length) throw new Error('not exported: ' + missing.join(', '));
            for (const gone of ['BridgeHttpService', 'BridgeHttpError']) {
              if (pkg[gone] !== undefined) throw new Error(gone + ' is a 0.x export and should be gone');
            }
            console.log('All exports OK for NestJS ${{ matrix.nest-version }}');
          "

      - name: Boot an app with the guard
        run: |
          cp .github/workflows/scripts/nest-boot-smoke.js install-test/
          cd install-test
          node nest-boot-smoke.js
